<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:#edf2ff;font-family:Arial,sans-serif}
header{padding:20px;text-align:center;border-bottom:1px solid #27334d}
h1{margin:0;color:#70b7ff;letter-spacing:3px}
header p{color:#8e9bb5;font-size:13px}
#chat{height:calc(100vh - 175px);overflow-y:auto;padding:16px;max-width:850px;margin:auto}
.msg{padding:13px 16px;margin:12px 0;border-radius:14px;max-width:90%;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.user{background:#193d67;margin-left:auto}
.ai{background:#182237;margin-right:auto}
#controls{position:fixed;bottom:0;left:0;right:0;background:#10182a;padding:12px;display:flex;gap:8px}
input{flex:1;min-width:0;background:#202c43;color:white;border:1px solid #3a4b69;border-radius:12px;padding:14px;font-size:16px}
button{background:#3989df;color:white;border:0;border-radius:12px;padding:0 20px;font-size:15px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
<h1>NEXUS AI</h1>
<p>Персональный искусственный интеллект</p>
</header>

<main id="chat">
<div class="msg ai">Привет! Я NEXUS AI. Чем могу помочь?</div>
</main>

<div id="controls">
<input id="message" placeholder="Напиши сообщение..." autocomplete="off">
<button id="send">Отправить</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const button = document.getElementById("send");
let history = [];

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text || button.disabled) return;

    input.value = "";
    addMessage(text, "user");
    history.push({role: "user", content: text});

    button.disabled = true;
    const waiting = addMessage("NEXUS AI думает...", "ai");

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({messages: history})
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.details || data.error || "Ошибка сервера");
        }

        const answer = data.reply || data.answer;

        if (typeof answer !== "string" || !answer.trim()) {
            throw new Error("Сервер вернул пустой ответ");
        }

        waiting.textContent = answer;
        history.push({role: "assistant", content: answer});

    } catch (error) {
        waiting.textContent = "Ошибка: " + error.message;
        history.pop();
    } finally {
        button.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
    }
}

button.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
    if (event.key === "Enter") sendMessage();
});
</script>
</body>
</html>
